name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        description: 'Version to release (ex. 1.2.3)'

permissions: {}

jobs:
  release:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Check version
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "version should be like '1.2.3'"; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # needed to push release commit/tag

      - uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          install_args: node pnpm
          cache: false

      - run: pnpm install --frozen-lockfile
      - run: pnpm test

      - name: Bump version and tag
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" package.json public/manifest.json
          git commit -am "Prepare release $VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD "v$VERSION"

      - run: pnpm build

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && zip -qr "../v$VERSION.zip" .)
          gh release create "v$VERSION" "v$VERSION.zip" LICENSE --draft --title "v$VERSION" --generate-notes
